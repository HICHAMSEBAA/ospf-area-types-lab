!=====================================================================
! R8 - Area 3 (NSSA) internal router and ASBR to EIGRP 100
! Lab: OSPFv2 Area Types | Address block 10.10.0.0/16
! Phase tags: [P1] addressing  [P2] OSPF baseline  [P3] area types
!             [P4] summarization  [P5] EIGRP boundary  [P6] Internet edge
!=====================================================================
hostname R8
no ip domain-lookup
ip cef
service timestamps debug datetime msec
service timestamps log datetime msec
line con 0
 logging synchronous
 exec-timeout 0 0
!
! [P1] addressing
interface Loopback0
 description Router-ID
 ip address 10.10.96.8 255.255.255.255
!
interface GigabitEthernet0/0
 description to R4 Gi0/1 (Area 3)
 ip address 10.10.97.1 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description to R10 Gi0/0 (Area 3)
 ip address 10.10.97.2 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/2
 description to R11 Gi0/0 (EIGRP 100 - NOT in OSPF)
 ip address 10.10.161.0 255.255.255.254
 no shutdown
 ! [P5] send only a default route to R11
 ip summary-address eigrp 100 0.0.0.0 0.0.0.0
!
! [P2] OSPF baseline
router ospf 1
 router-id 10.10.96.8
 auto-cost reference-bandwidth 100000
 log-adjacency-changes detail
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 ! [P3] Area 3 = NSSA
 area 3 nssa
 ! [P4] summarize the external (Type 7) EIGRP space
 summary-address 10.10.160.0 255.255.224.0
 ! [P5] one-way redistribution EIGRP -> OSPF
 redistribute eigrp 100 subnets route-map EIGRP-TO-OSPF
!
interface Loopback0
 ip ospf 1 area 3
interface GigabitEthernet0/0
 ip ospf network point-to-point
 ip ospf 1 area 3
interface GigabitEthernet0/1
 ip ospf network point-to-point
 ip ospf 1 area 3
!
! [P5] EIGRP boundary
route-map EIGRP-TO-OSPF permit 10
 set tag 100
!
router eigrp 100
 eigrp router-id 10.10.96.8
 network 10.10.161.0 0.0.0.1
 passive-interface default
 no passive-interface GigabitEthernet0/2
!
end
