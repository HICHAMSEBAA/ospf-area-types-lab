!=====================================================================
! Net - Simulated Internet / ISP (no OSPF, no EIGRP)
! Lab: OSPFv2 Area Types | Address block 10.10.0.0/16
! Phase tags: [P1] addressing  [P6] Internet edge
!=====================================================================
hostname Net
no ip domain-lookup
ip cef
service timestamps debug datetime msec
service timestamps log datetime msec
line con 0
 logging synchronous
 exec-timeout 0 0
!
! [P1] addressing
interface Loopback0
 description Simulated Internet host
 ip address 8.8.8.8 255.255.255.255
!
interface GigabitEthernet0/0
 description to R9 Gi0/1
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
! [P6] return route to the whole lab block
ip route 10.10.0.0 255.255.0.0 203.0.113.1
!
end
