!=====================================================================
! R5 - ABR: Area 0 / Area 4 (TOTALLY NSSA) and NSSA translator (7 -> 5)
! Lab: OSPFv2 Area Types | Address block 10.10.0.0/16
! Phase tags: [P1] addressing  [P2] OSPF baseline  [P3] area types
!             [P4] summarization  [P5] EIGRP boundary  [P6] Internet edge
!=====================================================================
hostname R5
no ip domain-lookup
ip cef
service timestamps debug datetime msec
service timestamps log datetime msec
line con 0
 logging synchronous
 exec-timeout 0 0
!
! [P1] addressing
interface Loopback0
 description Router-ID
 ip address 10.10.0.5 255.255.255.255
!
interface GigabitEthernet0/0
 description to R1 Gi0/3 (Area 0)
 ip address 10.10.1.7 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description to R9 Gi0/0 (Area 4)
 ip address 10.10.129.0 255.255.255.254
 no shutdown
!
! [P2] OSPF baseline
router ospf 1
 router-id 10.10.0.5
 auto-cost reference-bandwidth 100000
 log-adjacency-changes detail
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 ! [P3] Area 4 = totally NSSA (no-summary only on the ABR)
 area 4 nssa no-summary
 ! [P4] summarize Area 4 toward the backbone
 area 4 range 10.10.128.0 255.255.224.0
 ! [P6] FALLBACK ONLY - uncomment if R1 does not learn the Internet
 !      default after Type 7 -> 5 translation (see docs/04):
 ! default-information originate
!
! [P6] discard route for unallocated 10.10.0.0/16 space (anti-loop R5 <-> R9)
ip route 10.10.0.0 255.255.0.0 Null0
! [P6] FALLBACK ONLY (pair with the commented line in router ospf):
! ip route 0.0.0.0 0.0.0.0 10.10.129.1
!
interface Loopback0
 ip ospf 1 area 0
interface GigabitEthernet0/0
 ip ospf network point-to-point
 ip ospf 1 area 0
interface GigabitEthernet0/1
 ip ospf network point-to-point
 ip ospf 1 area 4
!
end
