!=====================================================================
! R6 - Internal router, Area 1 (STUB)
! Lab: OSPFv2 Area Types | Address block 10.10.0.0/16
! Phase tags: [P1] addressing  [P2] OSPF baseline  [P3] area types
!             [P4] summarization  [P5] EIGRP boundary  [P6] Internet edge
!=====================================================================
hostname R6
no ip domain-lookup
ip cef
service timestamps debug datetime msec
service timestamps log datetime msec
line con 0
 logging synchronous
 exec-timeout 0 0
!
! [P1] addressing
interface Loopback0
 description Router-ID
 ip address 10.10.32.6 255.255.255.255
!
interface GigabitEthernet0/0
 description to R2 Gi0/1 (Area 1)
 ip address 10.10.33.1 255.255.255.254
 no shutdown
!
! [P2] OSPF baseline
router ospf 1
 router-id 10.10.32.6
 auto-cost reference-bandwidth 100000
 log-adjacency-changes detail
 passive-interface default
 no passive-interface GigabitEthernet0/0
 ! [P3] Area 1 = stub
 area 1 stub
!
interface Loopback0
 ip ospf 1 area 1
interface GigabitEthernet0/0
 ip ospf network point-to-point
 ip ospf 1 area 1
!
end
