!=====================================================================
! R3 - ABR: Area 0 / Area 2 (TOTALLY STUBBY)
! Lab: OSPFv2 Area Types | Address block 10.10.0.0/16
! Phase tags: [P1] addressing  [P2] OSPF baseline  [P3] area types
!             [P4] summarization  [P5] EIGRP boundary  [P6] Internet edge
!=====================================================================
hostname R3
no ip domain-lookup
ip cef
service timestamps debug datetime msec
service timestamps log datetime msec
line con 0
 logging synchronous
 exec-timeout 0 0
!
! [P1] addressing
interface Loopback0
 description Router-ID
 ip address 10.10.0.3 255.255.255.255
!
interface GigabitEthernet0/0
 description to R1 Gi0/1 (Area 0)
 ip address 10.10.1.3 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description to R7 Gi0/0 (Area 2)
 ip address 10.10.65.0 255.255.255.254
 no shutdown
!
! [P2] OSPF baseline
router ospf 1
 router-id 10.10.0.3
 auto-cost reference-bandwidth 100000
 log-adjacency-changes detail
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 ! [P3] Area 2 = totally stubby (no-summary only on the ABR)
 area 2 stub no-summary
 ! [P4] summarize Area 2 toward the backbone
 area 2 range 10.10.64.0 255.255.224.0
!
interface Loopback0
 ip ospf 1 area 0
interface GigabitEthernet0/0
 ip ospf network point-to-point
 ip ospf 1 area 0
interface GigabitEthernet0/1
 ip ospf network point-to-point
 ip ospf 1 area 2
!
end
