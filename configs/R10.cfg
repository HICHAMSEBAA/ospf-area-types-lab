!=====================================================================
! R10 - Internal router, Area 3 (NSSA)
! Lab: OSPFv2 Area Types | Address block 10.10.0.0/16
! Phase tags: [P1] addressing  [P2] OSPF baseline  [P3] area types
!             [P4] summarization  [P5] EIGRP boundary  [P6] Internet edge
!=====================================================================
hostname R10
no ip domain-lookup
ip cef
service timestamps debug datetime msec
service timestamps log datetime msec
line con 0
 logging synchronous
 exec-timeout 0 0
!
! [P1] addressing
interface Loopback0
 description Router-ID
 ip address 10.10.96.10 255.255.255.255
!
interface GigabitEthernet0/0
 description to R8 Gi0/1 (Area 3)
 ip address 10.10.97.3 255.255.255.254
 no shutdown
!
! [P2] OSPF baseline
router ospf 1
 router-id 10.10.96.10
 auto-cost reference-bandwidth 100000
 log-adjacency-changes detail
 passive-interface default
 no passive-interface GigabitEthernet0/0
 ! [P3] Area 3 = NSSA
 area 3 nssa
!
interface Loopback0
 ip ospf 1 area 3
interface GigabitEthernet0/0
 ip ospf network point-to-point
 ip ospf 1 area 3
!
end
