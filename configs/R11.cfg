!=====================================================================
! R11 - EIGRP 100 domain (leaf behind R8)
! Lab: OSPFv2 Area Types | Address block 10.10.0.0/16
! Phase tags: [P1] addressing  [P2] OSPF baseline  [P3] area types
!             [P4] summarization  [P5] EIGRP boundary  [P6] Internet edge
!=====================================================================
hostname R11
no ip domain-lookup
ip cef
service timestamps debug datetime msec
service timestamps log datetime msec
line con 0
 logging synchronous
 exec-timeout 0 0
!
! [P1] addressing
interface Loopback0
 description Router-ID
 ip address 10.10.160.11 255.255.255.255
!
interface Loopback1
 description Simulated LAN
 ip address 10.10.162.1 255.255.255.0
!
interface GigabitEthernet0/0
 description to R8 Gi0/2
 ip address 10.10.161.1 255.255.255.254
 no shutdown
!
! [P5] EIGRP
router eigrp 100
 eigrp router-id 10.10.160.11
 network 10.10.160.11 0.0.0.0
 network 10.10.161.0 0.0.0.1
 network 10.10.162.0 0.0.0.255
 passive-interface default
 no passive-interface GigabitEthernet0/0
!
end
