!=====================================================================
! R9 - Area 4 (TOTALLY NSSA) internal router and Internet-facing ASBR
! Lab: OSPFv2 Area Types | Address block 10.10.0.0/16
! Phase tags: [P1] addressing  [P2] OSPF baseline  [P3] area types
!             [P4] summarization  [P5] EIGRP boundary  [P6] Internet edge
!=====================================================================
hostname R9
no ip domain-lookup
ip cef
service timestamps debug datetime msec
service timestamps log datetime msec
line con 0
 logging synchronous
 exec-timeout 0 0
!
! [P1] addressing
interface Loopback0
 description Router-ID
 ip address 10.10.128.9 255.255.255.255
!
interface GigabitEthernet0/0
 description to R5 Gi0/1 (Area 4)
 ip address 10.10.129.1 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description to Net Gi0/0 (Internet - NOT in OSPF)
 ip address 203.0.113.1 255.255.255.252
 no shutdown
!
! [P2] OSPF baseline
router ospf 1
 router-id 10.10.128.9
 auto-cost reference-bandwidth 100000
 log-adjacency-changes detail
 passive-interface default
 no passive-interface GigabitEthernet0/0
 ! [P3] Area 4 = NSSA (no-summary is configured on R5 only)
 area 4 nssa
 ! [P6] originate the Internet default as Type 7
 default-information originate
!
interface Loopback0
 ip ospf 1 area 4
interface GigabitEthernet0/0
 ip ospf network point-to-point
 ip ospf 1 area 4
!
! [P6] Internet edge
ip route 0.0.0.0 0.0.0.0 203.0.113.2
! Internal space goes to R5. Without this route the static default (AD 1)
! would beat the OSPF default and send internal traffic to Net.
ip route 10.10.0.0 255.255.0.0 10.10.129.0
!
end
