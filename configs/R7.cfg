!=====================================================================
! R7 - Internal router, Area 2 (TOTALLY STUBBY)
! Lab: OSPFv2 Area Types | Address block 10.10.0.0/16
! Phase tags: [P1] addressing  [P2] OSPF baseline  [P3] area types
!             [P4] summarization  [P5] EIGRP boundary  [P6] Internet edge
!=====================================================================
hostname R7
no ip domain-lookup
ip cef
service timestamps debug datetime msec
service timestamps log datetime msec
line con 0
 logging synchronous
 exec-timeout 0 0
!
! [P1] addressing
interface Loopback0
 description Router-ID
 ip address 10.10.64.7 255.255.255.255
!
interface GigabitEthernet0/0
 description to R3 Gi0/1 (Area 2)
 ip address 10.10.65.1 255.255.255.254
 no shutdown
!
! [P2] OSPF baseline
router ospf 1
 router-id 10.10.64.7
 auto-cost reference-bandwidth 100000
 log-adjacency-changes detail
 passive-interface default
 no passive-interface GigabitEthernet0/0
 ! [P3] plain "stub" on internal routers (no-summary is ABR-only)
 area 2 stub
!
interface Loopback0
 ip ospf 1 area 2
interface GigabitEthernet0/0
 ip ospf network point-to-point
 ip ospf 1 area 2
!
end
